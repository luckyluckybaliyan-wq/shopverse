<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopVerse Lite - HTML/CSS/JS Version</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <a class="logo" href="#">Shop<span>Verse</span> Lite</a>
    <input id="search" type="search" placeholder="Search for products, brands and more" aria-label="Search" />
    <button id="cart-btn" class="cart-btn">🛒 Cart <span id="cart-count">0</span></button>
  </header>

  <section class="hero">
    <div class="slides" id="slides"></div>
    <button class="arrow left" id="prev" aria-label="Previous">‹</button>
    <button class="arrow right" id="next" aria-label="Next">›</button>
  </section>

  <nav class="chips" id="chips" aria-label="Categories"></nav>

  <main>
    <div class="toolbar">
      <h2 id="heading">All Products</h2>
      <select id="sort" aria-label="Sort">
        <option value="">Relevance</option>
        <option value="asc">Price: Low to High</option>
        <option value="desc">Price: High to Low</option>
        <option value="rating">Rating</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <aside class="drawer" id="drawer" aria-label="Shopping cart">
    <div class="drawer-head"><h3>Your Cart</h3><button id="close-cart" aria-label="Close cart">✕</button></div>
    <div id="cart-items"></div>
    <div class="drawer-foot"><b>Total: <span id="cart-total">₹0</span></b><button id="checkout">Checkout</button></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <footer>© 2026 ShopVerse Lite · Pure HTML, CSS & JavaScript · Portfolio project by Lucky Baliyan</footer>
  <script src="script.js"></script>
</body>
</html>
